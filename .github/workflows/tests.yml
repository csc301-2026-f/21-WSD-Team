name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  algo01-unit-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest flask

      - name: Install Windows collector test dependencies
        if: runner.os == 'Windows'
        run: python -m pip install WMI pywin32 pywintrace psutil

      - name: Run ALGO-01 unit tests
        run: python -B -m pytest backend/algorithms/algo01/tests -q
      - name: Run all tests in tests/ (QA contract, HTTP, US-02 integration, DB, demo, collector)
        run: python -B -m pytest tests -v
