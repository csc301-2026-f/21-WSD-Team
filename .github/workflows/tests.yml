name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  algo01-unit-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run ALGO-01 unit tests
        run: python -B -m unittest discover -s backend/algorithms/algo01/tests -v
